<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Dashboard - REOYH</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">
</head>

<body>

    <section class="dashboard">

        <!-- HEADER -->
        <div class="dashboard-header">
            <div>
                <h2>Welcome, <span id="username"></span> 👋</h2>
                <p class="subtext">Manage your sessions and profile</p>
            </div>

            <div class="actions">
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <!-- GRID -->
        <div class="dashboard-grid">

            <!-- LEFT: REQUESTS -->
            <div class="card">
                <div class="card-header">
                    <h3>Your Sessions</h3>
                </div>

                <div class="card-body">
                    <div id="bookingList">
                        <p class="muted">No sessions booked yet.</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: PROFILE -->
            <div class="card">
                <h3>Your Profile</h3>

                <p><b>Name:</b> <span id="profileName"></span></p>
                <p><b>Email:</b> <span id="profileEmail"></span></p>
                <p><b>Role:</b> Tutor</p>

                <div id="profileDetails"></div>
            </div>

        </div>
        <br>
        <h2>Add New Listing</h2>

        <form id="listingForm" class="listing-form">
            <div class="form-row">
                <input type="text" id="title" placeholder="Title (e.g. Class 10 Maths)" required />
                <input type="text" id="subject" placeholder="Subject" required />
            </div>

            <div class="listing-filters">
                <select title="Class" id="classLevel">
                    <option value="">Class</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>

                <select title="Board" id="board">
                    <option value="">Board/Exam</option>
                    <option value="CBSE">CBSE</option>
                    <option value="ICSE">ICSE</option>
                    <option value="JEE">JEE</option>
                    <option value="NEET">NEET</option>
                    <option value="CUET">CUET</option>
                    <option value="SAT">SAT</option>
                </select>

                <select id="mode">
                    <option value="">Select Mode</option>
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                    <option value="hybrid">Hybrid</option>
                </select>

            </div>


            <div class="form-row">
                <input type="number" id="price" placeholder="Price per hour" required />
            </div>

            <textarea id="description" placeholder="Description"></textarea>

            <button type="submit">Add Listing</button>
        </form>


    </section>

    <script type="module" src="../js/dashboard.js"></script>

</body>

</html>
