<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - REOYH</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <div class="container nav-container">

            <div class="logo">
                <img src="assets/logo.png">
                <span>REOYH</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="findTutor.html">Find Tutors</a></li>

    <!-- LOGIN SECTION -->

    <section class="login-section">

        <div class="login-card">

            <h2>Login to REOYH</h2>

            <form>

                <input type="email" placeholder="Email Address" required>

                <input type="password" placeholder="Password" required>

                <a href="dashboard.html" class="cta-btn">
                    Login
                </a>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </section>

</body>
