<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - REOYH</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <div class="container nav-container">

            <div class="logo">
                <img src="assets/logo.png">
                <span>REOYH</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="findTutor.html">Find Tutors</a></li>
                <li><a href="become-tutor.html">Become a Tutor</a></li>
            </ul>

        </div>
    </nav>


    <!-- SIGNUP SECTION -->

    <section class="signup-section">

        <div class="signup-card">

            <h2>Create an Account</h2>

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

                <input type="text" placeholder="Phone Number" required>

                <input type="password" placeholder="Password" required>

                <input type="password" placeholder="Confirm Password" required>

                <select>
                    <option disabled selected>I am a...</option>
                    <option>Student</option>
                    <option>Tutor</option>
                </select>

                <button class="cta-btn">Create Account</button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </section>

</body>

</html>
