<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - REOYH</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <div class="container nav-container">

            <div class="logo">
                <img src="../assets/logo.png">
                <span>EOYH</span>
            </div>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="findTutor.html">Find Tutors</a></li>
                <li><a href="become-tutor.html">Become a Tutor</a></li>
            </ul>

        </div>
    </nav>


    <!-- SIGNUP SECTION -->
    <section class="signup-section">

        <div class="signup-card">

            <h2>Create an Account</h2>

            <form id="signup-form" novalidate>

                <input id="name" type="text" placeholder="Full Name">

                <input id="email" type="email" placeholder="Email Address">

                <input id="phone" type="text" placeholder="Phone Number">

                <div class="password-field">
    <input id="password" type="password" placeholder="Password">
    <span class="togglePassword">👁️</span>
</div>

<div class="password-field">
    <input id="confirm-password" type="password" placeholder="Confirm Password">
    <span class="togglePassword">👁️</span>
</div>

                <select id="role">
                    <option value="default" disabled selected>I am a...</option>
                    <option value="Student">Student</option>
                    <option value="Tutor">Tutor</option>
                </select>

                <button type="submit" class="cta-btn">Create Account</button>

            </form>

            <p id="signupMsg"></p>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </section>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
