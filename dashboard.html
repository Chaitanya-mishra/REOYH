<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - REOYH</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
    <style>
        .dashboard {
            padding: 60px 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            font-family: "Poppins";
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .booking-item:last-child {
            border: none;
        }

        .cta-btn {
            background: #F97316;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <section class="dashboard">

        <div class="dashboard-header">
            <h2>Welcome Back 👋</h2>
            <a href="findTutor.html" class="cta-btn">Find Tutors</a>
        </div>

        <div class="dashboard-grid">

            <!-- LEFT -->
            <div class="card">

                <h3>Your Sessions</h3>

                <div id="bookingList">

                    <div class="booking-item">
                        <div>
                            <p><strong>Dr. Priya Sharma</strong></p>
                            <p class="muted">12 March • 4:00 PM • Online</p>
                        </div>
                    </div>

                    <div class="booking-item">
                        <div>
                            <p><strong>Rahul Kumar</strong></p>
                            <p class="muted">15 March • 6:00 PM • Home</p>
                        </div>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="card">

                <h3>Your Profile</h3>

                <p><strong>Name:</strong> Student Name</p>
                <p><strong>Email:</strong> student@email.com</p>

                <br>

                <a href="findTutor.html" class="cta-btn">Book New Session</a>

            </div>

        </div>

    </section>

</body>

</html>
