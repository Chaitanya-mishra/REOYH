<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session - Reoyh</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fc;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .tutor-card {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .tutor-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
        }

        .tutor-info h3 {
            margin: 0;
            font-size: 22px;
        }

        .tutor-info p {
            margin: 5px 0 0;
            color: #666;
        }

        .booking-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
        }

        .time-slots {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .time-btn {
            padding: 10px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 8px;
        }

        .time-btn.active {
            background: #4CAF50;
            color: white;
        }

        .error {
            text-align: center;
            margin-top: 50px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="tutorContainer"></div>
    </div>

    <div class="booking-box">

        <h2>Book Your Session</h2>

        <!-- DATE -->
        <label>Select Date:</label>
        <input type="date" id="sessionDate">

        <!-- TIME -->
        <label>Select Time:</label>
        <div class="time-slots">
            <button class="time-btn">10:00 AM</button>
            <button class="time-btn">12:00 PM</button>
            <button class="time-btn">2:00 PM</button>
            <button class="time-btn">4:00 PM</button>
        </div>

        <!-- CONFIRM -->
        <button id="confirmBtn" class="cta-btn">Confirm Booking</button>

        <p id="bookingMsg"></p>

    </div>

    <script>
        const tutors = [
            {
                id: 1,
                name: "Dr. Priya Sharma",
                details: "PhD Mathematics • IIT Delhi",
                img: "assets/placeholder.jpg"
            },
            {
                id: 2,
                name: "Rahul Kumar",
                details: "MSc Chemistry • DU",
                img: "assets/placeholder.jpg"
            },
            {
                id: 3,
                name: "Anjali Verma",
                details: "MA English • JNU",
                img: "assets/placeholder.jpg"
            }
        ];

        // GET ID FROM URL
        const params = new URLSearchParams(window.location.search);
        const tutorId = params.get("id");

        // FIND TUTOR
        const tutor = tutors.find(t => t.id == tutorId);

        const container = document.getElementById("tutorContainer");

        if (tutor) {
            container.innerHTML = `
                <div class="tutor-card">
                    <img src="${tutor.img}" alt="${tutor.name}" 
                         onerror="this.src='https://via.placeholder.com/120'">
                    <div class="tutor-info">
                        <h3>${tutor.name}</h3>
                        <p>${tutor.details}</p>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="error">
                    <h2>Tutor not found</h2>
                    <p>Please go back and select a valid tutor.</p>
                </div>
            `;
        }

        // TIME SELECTION
        let selectedTime = null;

        const timeButtons = document.querySelectorAll(".time-btn");

        timeButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                timeButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedTime = btn.innerText;
            });
        });

        // CONFIRM BOOKING
        document.getElementById("confirmBtn").addEventListener("click", () => {

            const date = document.getElementById("sessionDate").value;

            if (!date || !selectedTime) {
                alert("Please select date and time");
                return;
            }

            const booking = {
                tutorId: tutorId,
                tutorName: tutor.name,
                date: date,
                time: selectedTime
            };

            // STORE IN LOCAL STORAGE
            localStorage.setItem("booking", JSON.stringify(booking));

            // SHOW MESSAGE
            document.getElementById("bookingMsg").innerText =
                `Session booked with ${tutor.name} on ${date} at ${selectedTime}`;

        });
    </script>

</body>

</html>
